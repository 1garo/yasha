services:
  cassandra:
    image: cassandra:4.1
    container_name: cassandra
    ports:
      - "9042:9042" # CQL
    environment:
      CASSANDRA_CLUSTER_NAME: "yasha_dev"
      CASSANDRA_NUM_TOKENS: 4
      CASSANDRA_START_RPC: "true"
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 100M
    volumes:
      - cassandra_data:/var/lib/cassandra

volumes:
  cassandra_data:
