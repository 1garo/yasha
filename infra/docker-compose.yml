services:
  postgres:
    image: postgres:17-alpine
    container_name: yasha-postgres
    environment:
      POSTGRES_DB: yasha
      POSTGRES_USER: yasha
      POSTGRES_PASSWORD: yasha
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yasha -d yasha"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:4
    container_name: yasha-adminer
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  postgres_data:
